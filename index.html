<style>
:root{--navy:#050b1c;--navy2:#13224a;--g1:#b8892f;--g2:#f3d98b;--g3:#d4a63c;--ink:#0a1228;--sub:#8fa0c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:'Montserrat',Arial,sans-serif;background:#02050f}
.card{position:relative;width:100%;max-width:420px;padding:44px 28px 30px;border-radius:26px;text-align:center;overflow:hidden;color:#fff;
background:radial-gradient(ellipse at 50% 12%,var(--navy2) 0%,var(--navy) 62%);border:1px solid rgba(212,166,60,.45);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(212,166,60,.18);border-radius:20px;pointer-events:none}
.bars{position:absolute;right:-10px;bottom:0;display:flex;align-items:flex-end;gap:14px;opacity:.07}
.bars i{width:34px;background:var(--g2);display:block}
.logo{position:relative;width:150px;height:150px;margin:0 auto 26px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--g2),var(--g1));box-shadow:0 0 50px rgba(212,166,60,.28)}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
h1{font-family:'Montserrat',Arial,sans-serif;font-weight:700;font-size:clamp(34px,11vw,48px);letter-spacing:.22em;margin-right:-.22em;line-height:1;
background:linear-gradient(180deg,#fbe9ad,var(--g3) 55%,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:14px 0 34px;font-size:10.5px;font-weight:600;letter-spacing:.34em;color:var(--g3);text-transform:uppercase}
.btn{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:9px 22px 9px 9px;border-radius:999px;text-decoration:none;color:var(--ink);
background:linear-gradient(100deg,var(--g1),var(--g2) 50%,var(--g3));box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 12px 28px rgba(212,166,60,.35),inset 0 1px 0 rgba(255,255,255,.6);outline:none}
.btn:active{transform:scale(.98)}
.ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.ic svg{width:21px;height:21px;fill:none;stroke:var(--g2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn span{flex:1;text-align:center;font-weight:600;font-size:16px;letter-spacing:.02em;margin-right:44px}
.hint{margin-top:26px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.hint svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:tap 1.8s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.hint svg{animation:none}}
.foot{margin-top:14px;font-size:10px;letter-spacing:.28em;color:var(--sub);text-transform:uppercase}
</style></head><body>
