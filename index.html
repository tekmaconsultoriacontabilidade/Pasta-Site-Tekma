<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEKMA · Consultoria & Contabilidade</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#050B18;--navy2:#0B1630;--g1:#F6D98A;--g2:#D4A441;--g3:#A87622;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#02050C;font-family:Montserrat,'Segoe UI',Arial,sans-serif;color:#fff}
body{display:flex;justify-content:center;align-items:center}
.card{position:relative;width:min(100%,430px);min-height:min(100vh,860px);padding:56px 34px 44px;display:flex;flex-direction:column;align-items:center;overflow:hidden;
background:radial-gradient(420px 360px at 85% 5%,#1d2d5a 0%,transparent 65%),radial-gradient(420px 380px at 0% 100%,#12234f 0%,transparent 65%),linear-gradient(165deg,var(--navy2),var(--navy) 72%)}
.card:before{content:"";position:absolute;inset:14px;border:1px solid rgba(212,164,65,.4);border-radius:4px;pointer-events:none}
.bars{position:absolute;right:-10px;bottom:70px;width:210px;height:250px;opacity:.07;background:repeating-linear-gradient(90deg,var(--g2) 0 30px,transparent 30px 52px);clip-path:polygon(0 100%,0 62%,100% 0,100% 100%);pointer-events:none}
.logo{position:relative;width:176px;height:176px;border-radius:50%;padding:5px;background:linear-gradient(135deg,var(--g1),var(--g2) 45%,var(--g3));box-shadow:0 0 60px rgba(212,164,65,.28)}
.logo img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;transform:scale(1.02)}
.script{margin-top:30px;font-family:Cinzel,'Trajan Pro',Georgia,serif;font-weight:800;font-size:60px;line-height:1;letter-spacing:.24em;padding-left:.24em;text-align:center;background:linear-gradient(100deg,var(--g3) 0%,var(--g1) 35%,var(--g2) 55%,var(--g1) 75%,var(--g3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(212,164,65,.3))}
.label{margin-top:16px;font-size:11px;letter-spacing:.42em;color:var(--g2);font-weight:600;text-align:center;padding-left:.42em}
.links{margin-top:40px;width:100%;display:flex;flex-direction:column;gap:16px}
a.btn{display:flex;align-items:center;gap:14px;height:58px;padding:0 10px;border-radius:40px;text-decoration:none;color:#071022;font-weight:600;font-size:18px;background:linear-gradient(100deg,var(--g3),var(--g1) 50%,var(--g2));box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,filter .15s}
a.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}a.btn:active{transform:scale(.98)}
a.btn span{flex:1;text-align:center;padding-right:38px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.ic{width:38px;height:38px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px;fill:var(--g1)}
.hint{margin-top:auto;padding-top:38px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.hint svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:18px;font-size:9px;letter-spacing:.3em;color:#7f8bab}
</style>
</head>
